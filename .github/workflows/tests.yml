name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Static analysis
        run: ruff check .

      - name: Property-based, unit tests and coverage
        run: pytest --cov=industrial_signal_toolkit --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Check installed dependencies
        run: python -m pip check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  windows-smoke:
    name: Windows smoke / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Verify API, examples and command-line calculation
        shell: pwsh
        run: |
          python -c "from industrial_signal_toolkit import AnalogScaling, scale_analog_value; r=scale_analog_value('10.25', AnalogScaling(gain='0.125', offset='-0.5')); assert str(r.engineering_value) == '0.78125'"
          python examples/quick_start.py
          istk scale --raw 10.25 --gain 0.125 --offset -0.5 --decimals 3

  macos-smoke:
    name: macOS smoke / Python ${{ matrix.python-version }}
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Verify API, examples and command-line calculation
        run: |
          python -c "from industrial_signal_toolkit import AnalogScaling, scale_analog_value; r=scale_analog_value('10.25', AnalogScaling(gain='0.125', offset='-0.5')); assert str(r.engineering_value) == '0.78125'"
          python examples/quick_start.py
          istk scale --raw 10.25 --gain 0.125 --offset -0.5 --decimals 3

  package:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, windows-smoke, macos-smoke]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          sha256sum dist/* > SHA256SUMS

      - name: Install and smoke-test wheel and source distribution
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          cd "$(mktemp -d)"
          python -I -c "from industrial_signal_toolkit import scale_analog_value, AnalogScaling; assert str(scale_analog_value('2', AnalogScaling(gain='3')).engineering_value) == '6'"
          istk scale --raw 2 --gain 3 --decimals 2
          python -m pip install --no-deps --force-reinstall "${GITHUB_WORKSPACE}"/dist/*.tar.gz
          python -I -c "from industrial_signal_toolkit import scale_analog_value, AnalogScaling; assert str(scale_analog_value('2', AnalogScaling(gain='3')).engineering_value) == '6'"
          istk scale --raw 2 --gain 3 --decimals 2

      - name: Upload release candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            dist/*
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  dependency-audit:
    name: Audit installed dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install project and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" pip-audit

      - name: Scan dependencies for known vulnerabilities
        run: pip-audit --skip-editable
