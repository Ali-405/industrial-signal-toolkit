name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Static analysis
        run: ruff check .

      - name: Unit tests and coverage
        run: pytest --cov=industrial_signal_toolkit --cov-report=term-missing --cov-fail-under=85

      - name: Check installed dependencies
        run: python -m pip check

  windows-smoke:
    name: Windows smoke / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Verify import and command-line calculation
        shell: pwsh
        run: |
          python -c "from industrial_signal_toolkit import AnalogScaling, scale_analog_value; r=scale_analog_value('10.25', AnalogScaling(gain='0.125', offset='-0.5')); assert str(r.engineering_value) == '0.78125'"
          istk scale --raw 10.25 --gain 0.125 --offset -0.5 --decimals 3

  package:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install and smoke-test built wheel
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "from industrial_signal_toolkit import scale_analog_value, AnalogScaling; assert str(scale_analog_value('2', AnalogScaling(gain='3')).engineering_value) == '6'"
          istk scale --raw 2 --gain 3 --decimals 2

  dependency-audit:
    name: Audit installed dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" pip-audit

      - name: Scan dependencies for known vulnerabilities
        run: pip-audit --skip-editable
